plugins {
    id 'base'
    id 'idea'
}

group = mod_group_id
version = mod_version

ext.sharedMetadata = [
        mod_id                 : mod_id,
        mod_name               : mod_name,
        mod_license            : mod_license,
        mod_version            : mod_version,
        mod_group_id           : mod_group_id,
        mod_authors            : mod_authors,
        mod_description        : mod_description,
        mod_homepage           : mod_homepage,
        mod_issues             : mod_issues,
        mod_credits            : mod_credits,
        minecraft_version      : minecraft_version,
        minecraft_version_range: minecraft_version_range,
        neo_version            : neo_version,
        loader_version_range   : loader_version_range,
        resource_pack_format   : resource_pack_format,
        data_pack_format       : data_pack_format
]

subprojects {
    apply plugin: 'idea'

    group = rootProject.group
    version = rootProject.version

    repositories {
        mavenCentral()
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        maven {
            name = 'NeoForged'
            url = 'https://maven.neoforged.net/releases/'
        }
        maven {
            name = 'ParchmentMC'
            url = 'https://maven.parchmentmc.org/'
        }
        maven {
            name = 'Terraformers'
            url = 'https://maven.terraformersmc.com/releases/'
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = Integer.parseInt(rootProject.java_version)
    }

    idea {
        module {
            downloadSources = true
            downloadJavadoc = true
        }
    }
}

gradle.projectsEvaluated {
    project(':neoforge').tasks.named('runServer', JavaExec).configure {
        standardInput = System.in
    }

    project(':fabric').tasks.named('runServer', JavaExec).configure {
        standardInput = System.in
    }
}

tasks.named('build').configure {
    dependsOn ':neoforge:build', ':fabric:build'
}

tasks.register('buildNeoForge') {
    group = LifecycleBasePlugin.BUILD_GROUP
    description = 'Builds the NeoForge jar.'
    dependsOn ':neoforge:build'
}

tasks.register('buildFabric') {
    group = LifecycleBasePlugin.BUILD_GROUP
    description = 'Builds the Fabric jar.'
    dependsOn ':fabric:build'
}

tasks.register('runNeoForgeClient') {
    group = 'application'
    description = 'Launches the NeoForge client run configuration.'
    dependsOn ':neoforge:runClient'
}

tasks.register('runNeoForgeServer') {
    group = 'application'
    description = 'Launches the NeoForge server run configuration.'
    dependsOn ':neoforge:runServer'
}

tasks.register('runFabricClient') {
    group = 'application'
    description = 'Launches the Fabric client run configuration.'
    dependsOn ':fabric:runClient'
}

tasks.register('runFabricServer') {
    group = 'application'
    description = 'Launches the Fabric server run configuration.'
    dependsOn ':fabric:runServer'
}
