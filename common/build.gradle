plugins {
    alias(libs.plugins.fabricloom)
    id 'java-library'
}

def clientPackagePattern = 'com/sythiex/hearthstonemod/client/**/*.java'

base {
    archivesName = "${mod_id}-common"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(Integer.parseInt(project.java_version))
    withSourcesJar()
}

sourceSets {
    main {
        java {
            exclude clientPackagePattern
        }
    }

    client {
        java.srcDir 'src/main/java'
        java.include clientPackagePattern
        resources.srcDir 'src/client/resources'
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += output + sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}

configurations {
    clientImplementation.extendsFrom implementation
    clientCompileOnly.extendsFrom compileOnly
    clientRuntimeOnly.extendsFrom runtimeOnly
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.layered() {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${project.parchment_minecraft_version}:${project.parchment_mappings_version}@zip")
    }

    compileOnly libs.fabricLoader
}

tasks.named('sourcesJar').configure {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from sourceSets.client.allSource
}

tasks.register('cleanClientCompileOutputs', Delete) {
    delete sourceSets.client.output.classesDirs
}

tasks.named('compileClientJava', JavaCompile).configure {
    dependsOn tasks.named('cleanClientCompileOutputs')
    options.incremental = false
    outputs.cacheIf { false }
}

tasks.named('jar', Jar).configure {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from sourceSets.client.output

    manifest {
        attributes(
                'FMLModType': 'GAMELIBRARY',
                'Automatic-Module-Name': "${project.group}.common"
        )
    }
}
