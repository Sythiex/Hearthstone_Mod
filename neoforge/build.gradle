plugins {
    alias(libs.plugins.moddev)
    id 'java-library'
}

def legacyArchiveBaseName = rootProject.mod_name.replace(' ', '')
def finalJarName = "${legacyArchiveBaseName}-${project.minecraft_version}-${project.mod_version}-NeoForge.jar"
def finalSourcesJarName = "${legacyArchiveBaseName}-${project.minecraft_version}-${project.mod_version}-NeoForge-sources.jar"

base {
    archivesName = "${mod_id}-neoforge"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(Integer.parseInt(project.java_version))
    withSourcesJar()
}

sourceSets {
    main {
        java.srcDir 'src/gametest/java'
        resources.srcDir 'src/generated/resources'
        resources.srcDir 'src/gametest/resources'
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

repositories {
    maven { url = 'https://api.modrinth.com/maven'; content { includeGroup 'maven.modrinth' } }
    maven { url = 'https://maven.ryanhcode.dev/releases'; content { includeGroup 'dev.ryanhcode.sable-companion' } }
}

dependencies {
    compileOnly project(path: ':common', configuration: 'namedElements')
    compileOnly files(project(':common').sourceSets.client.output)
    compileOnly 'maven.modrinth:sable:U678xqle' // NeoForge 1.21.1, Sable 2.0.5
    compileOnly 'dev.ryanhcode.sable-companion:sable-companion-common-1.21.1:1.6.0'
    if (providers.gradleProperty('sableCompat').isPresent()) {
        localRuntime 'maven.modrinth:sable:U678xqle'
    }
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = project.file('build/run-gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces', 'hearthstonemod_tests'
            systemProperty 'hearthstonemod.gametest', 'true'
            systemProperty 'hearthstonemod.restartTest', providers.gradleProperty('restartTest').getOrElse('')
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources').absolutePath, '--existing',
                    rootProject.project(':common').file('src/main/resources').absolutePath, '--existing', file('src/main/resources').absolutePath
        }

        configureEach {
            logLevel = name == 'gameTestServer' ? org.slf4j.event.Level.INFO : org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${project.mod_id}" {
            sourceSet(sourceSets.main)
            sourceSet(project(':common').sourceSets.main)
            sourceSet(project(':common').sourceSets.client)
        }
    }
}

tasks.named('processResources', ProcessResources).configure {
    inputs.properties(rootProject.sharedMetadata + [version: project.version])

    filesMatching('META-INF/neoforge.mods.toml') {
        expand(rootProject.sharedMetadata + [version: project.version])
    }
}

tasks.named('jar', Jar).configure {
    dependsOn ':common:classes', ':common:clientClasses'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    archiveFileName = finalJarName
    from project(':common').sourceSets.main.output
    from project(':common').sourceSets.client.output
    exclude 'com/sythiex/hearthstonemod/neoforge/gametest/**'
    exclude 'data/hearthstonemod_tests/**'
}

tasks.named('sourcesJar').configure {
    dependsOn ':common:classes', ':common:clientClasses'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    archiveFileName = finalSourcesJarName
    from project(':common').sourceSets.main.allSource
    from project(':common').sourceSets.client.allSource
    exclude 'com/sythiex/hearthstonemod/neoforge/gametest/**'
}
